<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BossSlayer</title>
<script src="https://cdn.jsdelivr.net/npm/smiles-drawer@2.1.7/dist/smiles-drawer.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=IM+Fell+English&family=MedievalSharp&display=swap');
:root{--gold:#f5c542;--pur:#9d6bff;--ink:#f2ecff;--dim:#b8a6d9;--red:#ff5c7a;--ok:#5ef2a0;--bg:#120819}
body.light{--bg:#f3ead2;--ink:#2a1a0a;--dim:#5a3b1a}
[hidden]{display:none!important}*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 'IM Fell English',Georgia,serif}
#app{max-width:420px;margin:0 auto;min-height:100vh;padding-bottom:92px}
.hdr{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;background:linear-gradient(#3a2412,#1a0f08);border-bottom:3px solid #c99a1a}
body.light .hdr{background:linear-gradient(#e9d7a8,#c9a264)}
.ttl{font:28px 'MedievalSharp',Georgia,serif;color:var(--gold);text-shadow:0 0 10px rgba(245,197,66,.55)}
body.light .ttl{color:#5a3208;text-shadow:none}
.stats{display:flex;gap:12px;align-items:center;font-size:14px;color:#f5e2b0}
body.light .stats{color:#2a1a0a}
.red{color:var(--red);letter-spacing:2px}.red span{opacity:.25}
.tabs{display:flex;gap:6px;margin:12px 14px 0}
.tabs button{flex:1;padding:8px;border-radius:8px;border:2px solid #7a5520;background:#f4e6bf;color:#2a1a0a;font:15px 'MedievalSharp',Georgia,serif;cursor:pointer}
.tabs button.on{background:linear-gradient(#ffe38a,#c99a1a);color:#2a1700}
.wp{position:relative;width:400px;max-width:100%;margin:8px auto 0}
.wp svg{position:absolute;left:0;top:0}
.wn{position:absolute;width:150px;transform:translateX(-50%);background:none;border:0;color:var(--ink);font:inherit;text-align:center;padding:0;cursor:pointer}
.wn:disabled{cursor:default}
.wc{width:70px;height:70px;margin:0 auto;border-radius:50%;display:grid;place-items:center;font-size:26px;background:radial-gradient(circle at 50% 35%,#9fefff,#1b3f7a 70%);border:4px solid #58e0ff;box-shadow:0 6px 0 #0a1a33,0 0 22px rgba(88,224,255,.7)}
.wn.boss .wc{width:88px;height:88px;font-size:38px}
.wn.done .wc{background:linear-gradient(#f5c542,#b8861a);color:#3a2208;border-color:#fff3b0;box-shadow:0 6px 0 #6b4a0c}
.wn.lock .wc{background:#2a2238;border-color:#4a3566;box-shadow:0 6px 0 #140c1f;opacity:.7}
.wn.open .wc{animation:pulse 1.6s infinite}
.wl{font-size:12px;font-weight:700;margin-top:8px;line-height:1.2;text-shadow:0 1px 3px #000}
.wn.lock .wl{color:#8e7fae}.wl small{display:block;font-weight:400;font-size:11px}
.go{position:absolute;left:50%;top:-34px;transform:translateX(-50%);background:#fff;color:#2a1700;font:800 12px system-ui;padding:4px 10px;border-radius:10px;white-space:nowrap}
@keyframes pulse{0%,100%{box-shadow:0 6px 0 #0a1a33,0 0 0 0 rgba(88,224,255,.6)}50%{box-shadow:0 6px 0 #0a1a33,0 0 0 14px rgba(88,224,255,0)}}
.sn{position:absolute;width:44px;height:44px;transform:translate(-50%,-50%);border-radius:50%;display:grid;place-items:center;font:700 15px 'MedievalSharp',Georgia,serif;color:#f2ecff;background:radial-gradient(circle at 35% 30%,#8a55c8,#2e1550 70%);border:3px solid #6a3fb0;box-shadow:0 4px 0 #0d0716;padding:0;cursor:pointer}
.sn.on{border-color:var(--gold);color:var(--gold);background:linear-gradient(#f5c542,#b8861a);color:#3a2208}
.sn.open{border-color:#58e0ff;box-shadow:0 0 14px rgba(88,224,255,.7);animation:pulse 1.6s infinite}
.sn.off{opacity:.4;cursor:default}
.sheet{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:420px;background:#1a0f2e;border:3px solid #c99a1a;border-radius:18px 18px 0 0;padding:16px;z-index:20}
.sheet.good{border-color:#5ef2a0}.sheet.bad{border-color:#ff5c7a}
.sheet p{margin:6px 0;color:#f5e2b0}.sheet h4{margin:0 0 6px;font:18px 'MedievalSharp',Georgia,serif}
.battle-top{display:flex;align-items:center;margin-bottom:8px}
.ghost-x{width:36px;height:36px;border-radius:50%;border:2px solid #7a5520;background:#f4e6bf;color:#2a1a0a;font-size:16px;cursor:pointer}
.pad{padding:14px}
.card{background:linear-gradient(#f4e6bf,#d9bd85);color:#2a1a0a;border:3px solid #7a5520;border-radius:6px;padding:14px;box-shadow:0 4px 0 #4a2f10;margin-bottom:12px}
.card h2,.card h3{font-family:'MedievalSharp',Georgia,serif;margin:0 0 8px}
.tag{font-size:12px;letter-spacing:1px;text-transform:uppercase;color:#7a4a10}
.row{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid rgba(90,59,26,.25);font-size:14px;color:#2a1a0a}
.row span{text-align:right}
.rule{font-weight:700;margin-bottom:6px}.trap{color:#6a1a1a}.sub{color:#5a3b1a;font-size:13px}
.mol{text-align:center;margin:4px 0 10px}
.mol svg{max-width:100%;height:auto}
#molecule-canvas{display:block;margin:0 auto;background:#fff;border:1px solid #c9a264;border-radius:6px}
.opt{display:block;width:100%;margin:8px 0;padding:12px;border-radius:8px;border:2px solid #7a5520;background:#fffdf7;color:#2a1a0a;font:inherit;font-size:16px;text-align:left;cursor:pointer}
.opt:disabled{opacity:.7;cursor:default}
.chip{display:inline-block;margin:4px;padding:8px 12px;border-radius:20px;border:1px solid #7a5520;background:#fffdf7;color:#2a1a0a;font:inherit;cursor:pointer}
.chip.on{border-color:#c99a1a;box-shadow:0 0 8px rgba(245,197,66,.6)}
.btn{display:block;width:100%;margin:8px 0;padding:12px;border-radius:8px;border:2px solid #4a2a0a;background:linear-gradient(#ffe38a,#c99a1a 55%,#8a5a1e);color:#2a1700;font:16px 'MedievalSharp',Georgia,serif;cursor:pointer;box-shadow:0 4px 0 #4a2a0a}
.btn.ghost{background:linear-gradient(#f4e6bf,#d9bd85);color:#4a2a0a;border:2px solid #7a5520;box-shadow:0 4px 0 #4a2f10}
.good{color:#2e7d32;font-weight:700}.bad{color:#b00020;font-weight:700}
.bar{height:10px;background:#1a0f08;border-radius:8px;overflow:hidden;border:1px solid #7a5520;margin:8px 0}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,#7b3fe4,#f5c542)}
.gear{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.slot{text-align:center;padding:10px 6px;border-radius:10px;background:rgba(201,154,38,.12);border:1px solid rgba(201,154,38,.25);color:#2a1a0a}
.slot.lock{opacity:.5;filter:grayscale(1)}.slot .ic{font-size:28px}
.ach{display:flex;gap:10px;align-items:center;padding:8px 10px;margin:6px 0;border-radius:8px;background:rgba(201,154,38,.08);border:1px solid rgba(201,154,38,.18);color:#2a1a0a}
.ach:not(.done){opacity:.6}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:420px;display:flex;background:linear-gradient(#2b1a10,#140a06);border-top:3px solid #c99a1a;z-index:10}
.nav button{flex:1;background:none;border:0;color:#c9b07a;padding:8px 0 10px;font-size:11px;cursor:pointer}
.nav button span{display:block;font-size:22px}.nav button.on{color:#ffe38a}
.switch{display:flex;align-items:center;gap:10px;background:none;border:0;color:#2a1a0a;font:inherit;cursor:pointer;padding:6px 0}
.track{width:46px;height:26px;border-radius:13px;background:#4a2d7a;border:2px solid #c99a1a;position:relative}
.knob{position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#f5c542;transition:left .2s}
.track.on{background:#c99a1a}.track.on .knob{left:22px;background:#2a1a0a}
.center{text-align:center;padding-top:20px}.big{font-size:56px}
.lbl{width:100%;background:none;border:0;font:inherit;text-align:left;cursor:pointer;padding:8px 0}
</style>
</head>
<body>
<div id="app">
  <div class="hdr"><div class="ttl">BossSlayer 🔥</div><div class="stats"><span id="streak"></span><span class="red" id="hearts"></span></div></div>
  <div id="home">
    <div class="tabs" id="branch-tabs"></div>
    <div class="wp" id="map"></div>
  </div>
  <div id="screen" class="pad" hidden></div>
  <div id="list" class="pad" hidden></div>
  <div id="grim" class="pad" hidden></div>
  <div id="prof" class="pad" hidden></div>
  <nav class="nav" id="nav">
    <button data-tab="home" class="on"><span>🏠</span>Home</button>
    <button data-tab="list"><span>🛡️</span>Bosses</button>
    <button data-tab="grim"><span>🔔</span>Grimoire</button>
    <button data-tab="prof"><span>🧙</span>Profile</button>
  </nav>
</div>
<script>
const EMBEDDED = {"chapters": [{"id": "mole-concept", "branch": "Physical", "title": "Mole Concept", "isFree": true, "briefing": {"weightage": "Not yet added from past papers", "askedAs": "Not yet added from past papers", "commonTrap": "Count atoms vs molecules: 1 mol of O2 has 2 mol of oxygen atoms."}, "formulaCard": {"rule": "n = w / M and N = n × 6.022 × 10²³", "notes": "Mole & Molar Mass. Limiting Reagent: Divide each reactant’s moles by its coefficient. The smallest value is limiting.", "trapToWatch": "Count atoms vs molecules: 1 mol of O2 has 2 mol of oxygen atoms. Compare moles, not masses. Equal masses rarely mean equal moles."}, "questions": [{"id": "mole-concept_01", "source": "Original", "prompt": "How many moles are in 4.0 g of O2 (M = 32 g/mol)?", "smiles": null, "explanation": "n = 4.0 / 32 = 0.125 mol.", "type": "mcq", "options": ["0.0625", "0.125", "0.25", "8"], "correctIndex": 1}, {"id": "mole-concept_02", "source": "Original", "prompt": "Twist: a compound has empirical formula CH2O and molar mass 180 g/mol. Molecular formula?", "smiles": null, "explanation": "Empirical mass 30, so 180 / 30 = 6. Multiply CH2O by 6 to get C6H12O6.", "type": "mcq", "options": ["C3H6O3", "C6H12O6", "C2H4O2", "C4H8O4"], "correctIndex": 1}, {"id": "mole-concept_03", "source": "Original", "prompt": "2H2 + O2 → 2H2O with 4 g H2 and 32 g O2. Moles of H2O formed?", "smiles": null, "explanation": "H2: 2 mol / 2 = 1. O2: 1 mol / 1 = 1. Both are limiting, so 2 mol H2O forms.", "type": "mcq", "options": ["1 mol", "2 mol", "4 mol", "3 mol"], "correctIndex": 1}, {"id": "mole-concept_04", "source": "Original", "prompt": "Twist: same reaction, but 4 g H2 and 16 g O2. Moles of H2 left unreacted?", "smiles": null, "explanation": "O2 is limiting (0.5 mol), so 1 mol H2 is used. 2 − 1 = 1 mol H2 remains.", "type": "mcq", "options": ["0", "0.5", "1", "1.5"], "correctIndex": 2}]}, {"id": "concentration-terms", "branch": "Physical", "title": "Concentration Terms", "isFree": false, "briefing": {"weightage": "Not yet added", "askedAs": "Not yet added", "commonTrap": "Not yet added"}, "formulaCard": {"rule": "Not yet added", "notes": "", "trapToWatch": ""}, "questions": []}, {"id": "structure-of-atom", "branch": "Physical", "title": "Structure of Atom", "isFree": false, "briefing": {"weightage": "Not yet added", "askedAs": "Not yet added", "commonTrap": "Not yet added"}, "formulaCard": {"rule": "Not yet added", "notes": "", "trapToWatch": ""}, "questions": []}, {"id": "periodic-table", "branch": "Inorganic", "title": "Periodic Table", "isFree": false, "briefing": {"weightage": "Not yet added", "askedAs": "Not yet added", "commonTrap": "Not yet added"}, "formulaCard": {"rule": "Not yet added", "notes": "", "trapToWatch": ""}, "questions": []}, {"id": "chemical-bonding", "branch": "Inorganic", "title": "Chemical Bonding", "isFree": false, "briefing": {"weightage": "Not yet added", "askedAs": "Not yet added", "commonTrap": "Not yet added"}, "formulaCard": {"rule": "Not yet added", "notes": "", "trapToWatch": ""}, "questions": []}, {"id": "gaseous-state", "branch": "Physical", "title": "Gaseous State", "isFree": false, "briefing": {"weightage": "Not yet added", "askedAs": "Not yet added", "commonTrap": "Not yet added"}, "formulaCard": {"rule": "Not yet added", "notes": "", "trapToWatch": ""}, "questions": []}, {"id": "thermodynamics", "branch": "Physical", "title": "Thermodynamics", "isFree": false, "briefing": {"weightage": "Not yet added", "askedAs": "Not yet added", "commonTrap": "Not yet added"}, "formulaCard": {"rule": "Not yet added", "notes": "", "trapToWatch": ""}, "questions": []}, {"id": "thermochemistry", "branch": "Physical", "title": "Thermochemistry", "isFree": false, "briefing": {"weightage": "Not yet added", "askedAs": "Not yet added", "commonTrap": "Not yet added"}, "formulaCard": {"rule": "Not yet added", "notes": "", "trapToWatch": ""}, "questions": []}, {"id": "chemical-equilibrium", "branch": "Physical", "title": "Chemical Equilibrium", "isFree": false, "briefing": {"weightage": "Not yet added", "askedAs": "Not yet added", "commonTrap": "Not yet added"}, "formulaCard": {"rule": "Not yet added", "notes": "", "trapToWatch": ""}, "questions": []}, {"id": "ionic-equilibrium", "branch": "Physical", "title": "Ionic Equilibrium", "isFree": true, "briefing": {"weightage": "Not yet added from past papers", "askedAs": "Not yet added from past papers", "commonTrap": "Without NH4Cl, excess OH⁻ precipitates Mg(OH)2 with Group III."}, "formulaCard": {"rule": "Add NH4Cl first, then NH4OH, in Group III", "notes": "NH4Cl Before NH4OH", "trapToWatch": "Without NH4Cl, excess OH⁻ precipitates Mg(OH)2 with Group III."}, "questions": [{"id": "ionic-equilibrium_01", "source": "Original", "prompt": "Why is NH4Cl added before NH4OH?", "smiles": null, "explanation": "NH4Cl lowers OH⁻ through the common-ion effect.", "type": "mcq", "options": ["To dissolve Fe³⁺", "To suppress OH⁻ so Mg²⁺ stays in solution", "To oxidize Cr³⁺", "To precipitate Group II"], "correctIndex": 1}, {"id": "ionic-equilibrium_02", "source": "Original", "prompt": "Which ion forms black PbS in acidic H2S (Group II)?", "smiles": null, "explanation": "Zn²⁺ is Group IV and Al³⁺ is Group III.", "type": "mcq", "options": ["Ca²⁺", "Zn²⁺", "Pb²⁺", "Al³⁺"], "correctIndex": 2}]}, {"id": "redox-reactions", "branch": "Physical", "title": "Redox Reactions", "isFree": false, "briefing": {"weightage": "Not yet added", "askedAs": "Not yet added", "commonTrap": "Not yet added"}, "formulaCard": {"rule": "Not yet added", "notes": "", "trapToWatch": ""}, "questions": []}, {"id": "iupac-nomenclature", "branch": "Organic", "title": "IUPAC Nomenclature", "isFree": true, "briefing": {"weightage": "Appeared 4 times in the last 20 years of JEE Advanced (2006, 2009, 2017, 2020)", "askedAs": "Name a given compound (3 of 4 questions); draw a structure from its name (1 of 4)", "commonTrap": "Seniority picks the parent: -CN outranks -OH, so the nitrile is the parent. Lowest locants next."}, "formulaCard": {"rule": "NAME = LOCANTS + PREFIX + ROOT + SUFFIX", "notes": "Root from the longest chain: meth 1, eth 2, prop 3, but 4, pent 5, hex 6, hept 7, oct 8, non 9, dec 10.", "trapToWatch": "Corners and line ends are carbons. Count them."}, "questions": [], "subTopics": [{"id": "iupac_skeleton", "branch": "Organic", "title": "IUPAC: Reading the Name Skeleton", "isFree": true, "briefing": {"weightage": "In every IUPAC paper question, the name starts from the carbon skeleton. Basic, but it carries the other sub-topics.", "askedAs": "Name a drawn chain; draw a chain from its name.", "commonTrap": "Corners and line ends are carbons. Count the longest chain before anything else."}, "formulaCard": {"rule": "NAME = LOCANTS + PREFIX + ROOT + SUFFIX", "notes": "Root from the longest chain: meth 1, eth 2, prop 3, but 4, pent 5, hex 6, hept 7, oct 8, non 9, dec 10.", "trapToWatch": "Corners and line ends are carbons. Count them."}, "questions": [{"id": "iupac_skeleton_01", "type": "mcq", "source": "Original", "prompt": "Name of this compound?", "smiles": "CCCC", "options": ["Propane", "Butane", "Pentane", "Ethane"], "correctIndex": 1, "explanation": "Four carbons, all single bonds: butane.", "svg": "<svg viewBox=\"0 0 190 90\" width=\"190\" height=\"90\" xmlns=\"http://www.w3.org/2000/svg\"><g stroke=\"#2a1a0a\" stroke-width=\"2\" fill=\"none\" font-family=\"serif\" font-size=\"13\" fill-opacity=\"1\"><line fill=\"none\" x1=\"40.0\" y1=\"34.0\" x2=\"70.0\" y2=\"54.0\"/><line fill=\"none\" x1=\"70.0\" y1=\"54.0\" x2=\"100.0\" y2=\"34.0\"/><line fill=\"none\" x1=\"100.0\" y1=\"34.0\" x2=\"130.0\" y2=\"54.0\"/><\/g><\/svg>"}, {"id": "iupac_skeleton_02", "type": "mcq", "source": "Original", "prompt": "Name of this compound?", "smiles": "CCCO", "options": ["Propan-1-ol", "Propan-2-ol", "Butan-1-ol", "Propanol-3"], "correctIndex": 0, "explanation": "Three carbons. OH on C1 gives the lowest locant.", "svg": "<svg viewBox=\"0 0 160 90\" width=\"160\" height=\"90\" xmln =\"100.0\" y2=\"34.0\"/><line fill=\"none\" x1=\"101.4\" y1=\"31.9\" x2=\"131.4\" y2=\"51.9\"/><line fill=\"none\" x1=\"98.6\" y1=\"36.1\" x2=\"128.6\" y2=\"56.1\"/><line fill=\"none\" x1=\"130.0\" y1=\"54.0\" x2=\"160.0\" y2=\"34.0\"/><\/g><\/svg>"}]}, {"id": "iupac_multiple_bonds", "branch": "Organic", "title": "IUPAC: Multiple Bonds", "isFree": true, "briefing": {"weightage": "Shows up in the 2020 paper: an ene and an yne in one name.", "askedAs": "Name an alkene, alkyne, diene or triene; pick the right locants.", "commonTrap": "\"-en\" comes before \"-yne\". Multiple bonds get the lowest locants before substituents."}, "formulaCard": {"rule": "Lowest locants to the multiple bonds as a set", "notes": "\"-en\" comes before \"-yne\". The parent chain holds the most multiple bonds.", "trapToWatch": "Multiple bonds beat substituents for low locants."}, "questions": [{"id": "iupac_multiple_bonds_01", "type": "mcq", "source": "Original", "prompt": "Name of this compound?", "smiles": "C=CCC", "options": ["But-1-ene", "But-2-ene", "Butane-1-ene", "Pent-1-ene"], "correctIndex": 0, "explanation": "Four carbons, double bond at C1.", "svg": "<svg viewBox=\"0 0 190 90\" width=\"190\" height=\"90\" xmlns=\"http://www.w3.org/2000/svg\"><g stroke=\"#2a1a0a\" stroke-width=\"2\" fill=\"none\" font-family=\"serif\" font-size=\"13\" fill-opacity=\"1\"><line fill=\"none\" x1=\"41.4\" y1=\"31.9\" x2=\"71.4\" y2=\"51.9\"/><line fill=\"none\" x1=\"38.6\" y1=\"36.1\" x2=\"68.6\" y2=\"56.1\"/><line fill=\"none\" x1=\"70.0\" y1=\"54.0\" x2=\"100.0\" y2=\"34.0\"/><line fill=\"none\" x1=\"100.0\" y1=\"34.0\" x2=\"130.0\" y2=\"54.0\"/><\/g><\/svg>"}, {"id": "iupac_multiple_bonds_02", "type": "mcq", "source": "Original", "prompt": "Name of this compound?", "smiles": "C#CC=CC=C", "options": ["Hexa-1,3-dien-5-yne", "Hexa-3,5-dien-1-yne", "Hexa-1,3-diyn-5-ene", "Hexa-2,4-dien-6-yne"], "correctIndex": 0, "explanation": "Numbering from either end gives the same locant set {1,3,5}. The tie goes to t  "prompt": "Twist: name of this compound?", "smiles": "CC(C)CCC(C)C", "options": ["2,5-Dimethylhexane", "2,5-Dimethylheptane", "3,6-Dimethylhexane", "2,5-Dimethylpentane"], "correctIndex": 0, "explanation": "Longest chain is 6 carbons, with methyls on C2 and C5.", "svg": "<svg viewBox=\"0 0 250 90\" width=\"250\" height=\"90\" xmlns=\"http://www.w3.org/2000/svg\"><g stroke=\"#2a1a0a\" stroke-width=\"2\" fill=\"none\" font-family=\"serif\" font-size=\"13\" fill-opacity=\"1\"><line fill=\"none\" x1=\"40.0\" y1=\"34.0\" x2=\"70.0\" y2=\"54.0\"/><line fill=\"none\" x1=\"70.0\" y1=\"54.0\" x2=\"100.0\" y2=\"34.0\"/><line fill=\"none\" x1=\"100.0\" y1=\"34.0\" x2=\"130.0\" y2=\"54.0\"/><line fill=\"none\" x1=\"130.0\" y1=\"54.0\" x2=\"160.0\" y2=\"34.0\"/><line fill=\"none\" x1=\"160.0\" y1=\"34.0\" x2=\"190.0\" y2=\"54.0\"/><line fill=\"none\" x1=\"70\" y1=\"54\" x2=\"70\" y2=\"72\"/><text x=\"70\" y=\"88\" text-anchor=\"middle\">CH3<\/text><line fill=\"none\" x1=\"160\" y1=\"34\" x2=\"160\" y2=\"16\"/><text x=\"160\" y=\"12\" text-anchor=\"middle\">CH3<\/text><\/g><\/svg>"}, {"id": "iupac_branched_alkanes_04", "type": "mcq", "source": "Original", "prompt": "Twist: this group is the tert-butyl group. Its IUPAC name is?", "smiles": "CC(C)(C)*", "options": ["1,1-Dimethylethyl", "sec-Butyl", "Isobutyl", "n-Butyl"], "correctIndex": 0, "explanation": "As a substituent, it is 1,1-dimethylethyl. Tert-butyl is accepted as a common name.", "svg": "<svg viewBox=\"0 0 160 90\" width=\"160\" height=\"90\" xmlns=\"http://www.w3.org/2000/svg\"><g stroke=\"#2a1a0a\" stroke-width=\"2\" fill=\"none\" font-family=\"serif\" font-size=\"13\" fill-opacity=\"1\"><line fill=\"none\" x1=\"40.0\" y1=\"34.0\" x2=\"70.0\" y2=\"54.0\"/><line fill=\"none\" x1=\"70.0\" y1=\"54.0\" x2=\"100.0\" y2=\"34.0\"/><line fill=\"none\" x1=\"70\" y1=\"54\" x2=\"70\" y2=\"36\"/><text x=\"70\" y=\"32\" text-anchor=\"middle\">CH3<\/text><line fill=\"none\" x1=\"70\" y1=\"54\" x2=\"70\" y2=\"72\"/><text x=\"70\" y= const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const KEY = 'bossslayer.v4';
const TEST = /[?&]test=1/.test(location.search);
let S = { streak: 0, last: '', cleared: {}, mistakes: [], sound: true, light: false };
try { Object.assign(S, JSON.parse(localStorage.getItem(KEY)) || {}); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };
const today = () => new Date().toDateString();
const yest = () => { const d = new Date(); d.setDate(d.getDate() - 1); return d.toDateString(); };

let DATA = [], BR = 'Physical', CUR = null, SUB = null, B = null;
const BRANCHES = ['Physical', 'Organic', 'Inorganic'];
const inBranch = (b) => DATA.filter((c) => c.branch === b);
const isDone = (id) => !!S.cleared[id];

// Strict order: a chapter opens only when every earlier chapter in its branch is cleared.
function chapterUnlocked(c) {
  if (TEST) return c.isFree;
  if (!c.isFree) return false;
  const list = inBranch(c.branch), k = list.indexOf(c);
  return k === 0 || (list[k - 1].isFree && isDone(list[k - 1].id));
}
// Sub-topics open in order.
const subUnlocked = (k) => TEST || k === 0 || isDone(CUR.subTopics[k - 1].id);
// A chapter with sub-topics is cleared when all of them are.
function syncParent(c) { if (c.subTopics && c.subTopics.every((s) => isDone(s.id))) S.cleared[c.id] = true; }

// ---------- Sound (synthesised, no files) ----------
let AC = null;
function sfx(n) {
  if (!S.sound) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const t = AC.currentTime;
    const tone = (f, st, d, type, v, to) => {
      const o = AC.createOscillator(), g = AC.createGain();
      o.type = type || 'sine'; o.frequency.setValueAtTime(f, t + st);
      if (to) o.frequency.exponentialRampToValueAtTime(to, t + st + d);
      g.gain.setValueAtTime(0.0001, t + st); g.gain.exponentialRampToValueAtTime(v || 0.2, t + st + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t + st + d);
      o.connect(g); g.connect(AC.destination); o.start(t + st); o.stop(t + st + d + 0.02);
    };
    if (n === 'click') tone(880, 0, 0.06, 'triangle', 0.15);
    else if (n === 'correct') { tone(523, 0, 0.12, 'sine', 0.25); tone(784, 0.1, 0.18, 'sine', 0.25); }
    else if (n === 'wrong') tone(220, 0, 0.25, 'sawtooth', 0.18, 140);
    else if (n === 'win') [523, 659, 784, 1047].forEach((f, k) => tone(f, k * 0.12, 0.25, 'triangle', 0.25));
    else if (n === 'lose') { tone(330, 0, 0.3, 'triangle', 0.25, 110); tone(220, 0.3, 0.4, 'triangle', 0.25, 90); }
  } catch (e) {}
}

// ---------- Data ----------
async function load() {
  try {
    const r = await fetch('./chapters.json');
    if (!r.ok) throw new Error('HTTP ' + r.status);
    DATA = (await r.json()).chapters;
  } catch (e) {
    console.warn('Using built-in chapters:', e.message);
    DATA = EMBEDDED.chapters;
  }
}

// ---------- Screens ----------
function show(which) {
  ['home', 'screen', 'list', 'grim', 'prof'].forEach((id) => { $(id).hidden = id !== which; });
  document.querySelectorAll('#nav button').forEach((b) => b.classList.toggle('on', b.dataset.tab === which));
  window.scrollTo(0, 0);
  updateHeader();
}
function showHome() { show('home'); renderTabs(); renderMap(); }

function updateHeader() {
  $('streak').textContent = 'Streak ' + S.streak;
  $('hearts').innerHTML = B && B.qs ? '♥'.repeat(B.hearts) + '<span>' + '♥'.repeat(3 - B.hearts) + '</span>' : '♥♥♥';
}

// ---------- Map ----------
function renderTabs() {
  $('branch-tabs').innerHTML = BRANCHES.map((b) => `<button class="${b === BR ? 'on' : ''}" data-b="${b}">${b}</button>`).join('');
}
const WX = [200, 290, 200, 110];
function renderMap() {
  const list = inBranch(BR), map = $('map');
  if (!list.length) { map.innerHTML = ''; return; }
  // Path slots: each chapter, followed by its sub-topic nodes when it has any.
  const slots = [];
  list.forEach((c) => {
    slots.push({ c, sub: null });
    if (c.subTopics) c.subTopics.forEach((s, j) => slots.push({ c, sub: j }));
  });
  const P = slots.map((_, n) => ({ x: WX[n % 4], y: 70 + n * 110 }));
  const H = P[P.length - 1].y + 110;
  let d = `M${P[0].x} ${P[0].y}`;
  for (let k = 1; k < P.length; k++) { const a = P[k - 1], b = P[k]; d += ` C${a.x} ${a.y + 55} ${b.x} ${b.y - 55} ${b.x} ${b.y}`; }
  const path = `<svg viewBox="0 0 400 ${H}" width="400" height="${H}"><path d="${d}" fill="none" stroke="#2b1a10" stroke-width="20" stroke-linecap="round"/><path d="${d}" fill="none" stroke="#8a55c8" stroke-width="3" stroke-dasharray="2 14" stroke-linecap="round"/></svg>`;
  const start = list.find((c) => c.isFree && !isDone(c.id) && chapterUnlocked(c));
  map.style.height = H + 'px';
  map.innerHTML = path + slots.map((sl, n) => {
    const left = P[n].x / 4 + '%';
    if (sl.sub !== null) {
      const parent = sl.c, sub = parent.subTopics[sl.sub];
      const parentOpen = chapterUnlocked(parent) || isDone(parent.id);
      const ok = parentOpen && (TEST || sl.sub === 0 || isDone(parent.subTopics[sl.sub - 1].id));
      const done = isDone(sub.id);
      const st = done ? 'on' : ok ? 'open' : 'off';
      const dis = !done && !ok ? 'disabled' : '';
      return `<button class="sn ${st}" style="left:${left};top:${P[n].y}px" data-parent="${esc(parent.id)}" data-sub="${sl.sub}" title="${esc(sub.title)}" ${dis}>${sl.sub + 1}</button>`;
    }
    const c = sl.c, done = isDone(c.id), open = !done && chapterUnlocked(c);
    const st = done ? 'done' : open ? 'open' : 'lock';
    const icon = done ? '★' : open ? (c.subTopics ? '🏰' : '⚔️') : '🔒';
    const sub = done ? '<small>Cleared</small>' : !c.isFree ? '<small>Coming soon</small>' : open ? '<small>Play now</small>' : '<small>Locked</small>';
    const go = c === start ? '<div class="go">START</div>' : '';
    const dis = st === 'lock' ? 'disabled' : '';
    return `<button class="wn ${st}${c.subTopics ? ' boss' : ''}" style="left:${left};top:${P[n].y - (c.subTopics ? 46 : 35)}px" data-id="${esc(c.id)}" ${dis}>${go}<div class="wc">${icon}</div><div class="wl">${esc(c.title)}${sub}</div></button>`;
  }).join('');
  const cur = map.querySelector('.wn.open, .sn.open'); if (cur) cur.scrollIntoView({ block: 'center' });
}

// ---------- Chapter, sub-topics and battle ----------
const rows = (b) => `<div class="row"><b>Weightage</b><span>${esc(b.weightage)}</span></div><div class="row"><b>Asked as</b><span>${esc(b.askedAs)}</span></div><div class="row"><b>Common trap</b><span>${esc(b.commonTrap)}</span></div>`;
const formula = (f) => `<div class="card"><div class="tag">Formula card</div><div class="rule">${esc(f.rule)}</div><p>${esc(f.notes)}</p><p class="trap"><b>Trap to watch:</b> ${esc(f.trapToWatch)}</p></div>`;

function openChapter(id) {
  const c = DATA.find((x) => x.id === id);
  if (!c) return;
  CUR = c; SUB = null;
  if (c.subTopics) return showSubList(c);
  if (!chapterUnlocked(c)) return;
  startBattle(c, null);
}

function showSubList(c) {
  $('screen').innerHTML = `<div class="pad"><div class="card"><div class="tag">Chapter</div><h2>${esc(c.title)}</h2>${rows(c.briefing)}</div><button class="btn ghost" data-a="back">← Back to map</button></div>`;
  show('screen');
}

function startBattle(c, sub) {
  CUR = c; SUB = sub;
  const t = sub || c;
  B = { qs: t.questions || [], i: 0, score: 0, hearts: 3, answered: false, seq: [] };
  $('screen').innerHTML = `<div class="pad"><div class="card"><div class="tag">${sub ? 'Sub-topic' : 'Chapter'}</div><h2>${esc(t.title)}</h2>${rows(t.briefing)}</div>${formula(t.formulaCard)}${B.qs.length
    ? '<button class="btn" data-a="begin">Begin</button>'
    : '<p class="sub">Questions for this chapter are not written yet.</p>'}<button class="btn ghost" data-a="back">← Back</button></div>`;
  show('screen');
}

function question() {
  const q = B.qs[B.i];
  B.answered = false; B.seq = [];
  const hearts = '♥'.repeat(B.hearts) + '<span>' + '♥'.repeat(3 - B.hearts) + '</span>';
  const img = q.svg ? q.svg : q.image ? `<img src="${q.image}" alt="Structure from the JEE Advanced paper" style="max-width:100%;height:auto">` : '';
  $('screen').innerHTML = `<div class="pad">
    <div class="battle-top"><button class="ghost-x" data-a="back" aria-label="Leave battle">✕</button><div class="bar" style="flex:1;margin:0 12px"><i style="width:${(B.i / B.qs.length) * 100}%"></i></div><span class="red">${hearts}</span></div>
    <div class="card"><div class="tag">Question ${B.i + 1} of ${B.qs.length}</div>
      <div class="mol"><canvas id="molecule-canvas" width="260" height="140" hidden></canvas>${img}</div>
      <h3>${esc(q.prompt)}</h3><div id="opts"></div></div>
    <div id="fb"></div></div>`;
  if (q.smiles && !q.image && !q.svg) drawMol(q.smiles);
  if (q.type === 'order') renderOrder(q);
  else $('opts').innerHTML = q.options.map((o, n) => `<button class="opt" data-a="pick" data-n="${n}">${esc(o)}</button>`).join('');
  updateHeader();
}

function drawMol(smi) {
  const c = $('molecule-canvas');
  if (!c) return;
  const fallback = () => {
    c.hidden = true;
    if (!(c.nextElementSibling && c.nextElementSibling.classList.contains('smi-text')))
      c.insertAdjacentHTML('afterend', `<p class="sub smi-text">Structure: ${esc(smi)}</p>`);
  };
  if (typeof SmilesDrawer === 'undefined' || !SmilesDrawer.parse) return fallback();
  // SmilesDrawer parses first, then draws the parsed tree onto the canvas.
  SmilesDrawer.parse(smi, (tree) => {
    try {
      c.hidden = false;
      new SmilesDrawer.Drawer({ width: 260, height: 140 }).draw(tree, 'molecule-canvas', 'light', false);
    } catch (e) { fallback(); }
  }, () => fallback());
}

function renderOrder(q) {
  $('opts').innerHTML = `<p class="sub">Tap in order, weakest first:</p><div>${q.items.map((it, n) => {
    const k = B.seq.indexOf(n);
    return `<button class="chip ${k >= 0 ? 'on' : ''}" data-a="tap" data-n="${n}">${k >= 0 ? (k + 1) + '. ' : ''}${esc(it)}</button>`;
  }).join('')}</div><button class="btn ghost" data-a="clear">Clear</button><button class="btn" data-a="lock">Lock in order</button>`;
}

function judge(ok, q, answer) {
  if (B.answered) return;
  B.answered = true;
  if (ok) { B.score++; S.mistakes = S.mistakes.filter((m) => m.q !== q.prompt); }
  else { B.hearts--; S.mistakes = [{ q: q.prompt, ans: answer, why: q.explanation, topic: (SUB || CUR).title }].concat(S.mistakes.filter((m) => m.q !== q.prompt)).slice(0, 50); }
  save(); sfx(ok ? 'correct' : 'wrong');
  document.querySelectorAll('#opts button').forEach((b) => { b.disabled = true; });
  $('fb').innerHTML = `<div class="sheet ${ok ? 'good' : 'bad'}"><h4 style="color:${ok ? '#5ef2a0' : '#ff5c7a'}">${ok ? 'Correct!' : 'Trap hit'}</h4><p>${esc(q.explanation)}</p><button class="btn" data-a="next">Continue</button></div>`;
  updateHeader();
}

function pick(n) { const q = B.qs[B.i]; judge(n === q.correctIndex, q, q.options[q.correctIndex]); }
function tap(n) {
  if (B.answered) return;
  const k = B.seq.indexOf(n); if (k >= 0) B.seq.splice(k, 1); else B.seq.push(n);
  renderOrder(B.qs[B.i]);
}
function lockSeq() {
  const q = B.qs[B.i];
  if (B.answered || B.seq.length < q.items.length) return;
  judge(B.seq.join() === q.correctOrder.join(), q, q.correctOrder.map((k) => q.items[k]).join(' → '));
}
function next() {
  B.i++;
  if (B.hearts <= 0) return finish(false);
  if (B.i < B.qs.length) return question();
  finish(true);
}
function finish(won) {
  const t = SUB || CUR;
  if (won) {
    S.cleared[t.id] = true;
    if (SUB) syncParent(CUR);
    if (S.last !== today()) { S.streak = S.last === yest() ? S.streak + 1 : 1; S.last = today(); }
    sfx('win');
  } else sfx('lose');
  save();
  $('screen').innerHTML = `<div class="pad"><div class="card center"><div class="big">${won ? '🏆' : '💀'}</div><h2>${won ? 'Boss slain!' : 'Out of hearts'}</h2><p class="sub">${B.score} / ${B.qs.length} correct</p>${won ? '' : '<button class="btn" data-a="retry">Retry</button>'}</div><button class="btn ghost" data-a="back">Back to map</button></div>`;
  updateHeader();
}

// ---------- Grimoire ----------
function renderGrim() {
  $('grim').innerHTML = !S.mistakes.length
    ? `<div class="card"><p class="sub">No mistakes yet. Questions you miss appear here automatically and leave once you answer them correctly.</p></div>`
    : `<h2 class="ttl" style="font-size:20px">Grimoire</h2>` + S.mistakes.map((m) => `<div class="ach done"><div style="flex:1"><b>${esc(m.q)}</b><div class="sub">Answer: ${esc(m.ans)}</div><div class="sub">${esc(m.why)}</div><div class="sub">${esc(m.topic)}</div></div></div>`).join('') + `<button class="btn ghost" data-a="clearG">Clear Grimoire</button>`;
  show('grim');
}

// ---------- Bosses list ----------
function renderList() {
  $('list').innerHTML = BRANCHES.map((b) => `<div class="card"><h3>${b} map</h3>` + inBranch(b).map((c) => {
    const ok = chapterUnlocked(c) || isDone(c.id);
    return `<button class="row lbl" data-id="${esc(c.id)}" ${ok ? '' : 'disabled'}><b>${esc(c.title)}</b><span>${isDone(c.id) ? 'Cleared' : ok ? 'Open' : c.isFree ? 'Locked' : 'Soon'}</span></button>`;
  }).join('') + `</div>`).join('');
  show('list');
}

// ---------- Profile ----------
function renderProf() {
  const cleared = DATA.filter((c) => isDone(c.id)).length;
  let rank = 'Novice';
  [[1, 'Apprentice'], [3, 'Journeyman'], [6, 'Adept'], [12, 'Master']].forEach(([n, r]) => { if (cleared >= n) rank = r; });
  const bars = BRANCHES.map((b) => {
    const l = inBranch(b), d = l.filter((c) => isDone(c.id)).length;
    return `<div class="row" style="border:0;padding:4px 0"><span>${b}</span><span>${d} / ${l.length}</span></div><div class="bar"><i style="width:${l.length ? Math.round(d / l.length * 100) : 0}%"></i></div>`;
  }).join('');
  const ach = [
    ['First Blood', 'Clear your first chapter', '⚔️', cleared >= 1],
    ['Three Gates', 'Clear 3 chapters', '🗝️', cleared >= 3],
    ['Half the Path', 'Clear 6 chapters', '🏅', cleared >= 6],
    ['Steady Hand', 'Reach a 3-day streak', '🔥', S.streak >= 3],
    ['Boss Slayer', 'Clear the IUPAC chapter', '🐉', isDone('iupac-nomenclature')],
    ['Dungeon Master', 'Clear 12 chapters', '👑', cleared >= 12]];
  const gear = [['Helm', 'Iron Helm', '🪖', 0], ['Weapon', "Scholar's Blade", '🗡️', 1], ['Armour', 'Mage Robe', '🥋', 2], ['Boots', 'Swift Boots', '🥾', 3], ['Cape', "Master's Cape", '🧥', 5]];
  $('prof').innerHTML = `
    <div class="card"><div style="display:flex;gap:14px;align-items:center"><div style="font-size:40px">🧙</div><div><h3 style="margin:0">Chemist</h3><div class="sub">${rank} · Level ${cleared + 1} · Streak ${S.streak}</div></div></div></div>
    <div class="card"><h3>Map progress</h3>${bars}</div>
    <div class="card"><h3>Combat Gear</h3><div class="gear">${gear.map(([s, it, ic, a]) => ach[a][3]
      ? `<div class="slot"><div class="ic">${ic}</div><b>${s}</b><div class="sub">${it}</div></div>`
      : `<div class="slot lock"><div class="ic">🔒</div><b>${s}</b><div class="sub">Unlock: ${ach[a][0]}</div></div>`).join('')}</div></div>
    <div class="card"><h3>Achievements <span class="sub">${ach.filter((a) => a[3]).length} / ${ach.length}</span></h3>${ach.map(([n, d, ic, ok]) =>
      `<div class="ach ${ok ? 'done' : ''}"><div style="font-size:24px;width:34px;text-align:center">${ok ? ic : '🔒'}</div><div style="flex:1"><b>${n}</b><div class="sub">${d}</div></div><div>${ok ? '✔' : ''}</div></div>`).join('')}</div>
    <div class="card"><h3>Settings</h3>
      <button class="switch" data-a="sound"><span class="track ${S.sound ? 'on' : ''}"><span class="knob"></span></span>${S.sound ? 'Sound effects on' : 'Sound effects off'}</button>
      <button class="switch" data-a="theme"><span class="track ${S.light ? 'on' : ''}"><span class="knob"></span></span>${S.light ? 'Light mode' : 'Dark mode'}</button>
      <button class="btn ghost" data-a="reset">Reset progress</button></div>`;
  show('prof');
}

// ---------- Events ----------
document.querySelectorAll('#nav button').forEach((b) => b.addEventListener('click', () => {
  const t = b.dataset.tab;
  if (t === 'home') showHome(); else if (t === 'list') renderList(); else if (t === 'grim') renderGrim(); else renderProf();
}));
$('branch-tabs').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  BR = b.dataset.b; renderTabs(); renderMap();
});
$('map').addEventListener('click', (e) => {
  const sn = e.target.closest('.sn');
  if (sn) {
    if (sn.disabled) return;
    const parent = DATA.find((c) => c.id === sn.dataset.parent);
    return startBattle(parent, parent.subTopics[+sn.dataset.sub]);
  }
  const b = e.target.closest('.wn'); if (!b || b.disabled) return;
  openChapter(b.dataset.id);
});
$('list').addEventListener('click', (e) => {
  const b = e.target.closest('[data-id]'); if (!b || b.disabled) return;
  openChapter(b.dataset.id);
});
$('screen').addEventListener('click', (e) => {
  const t = e.target.closest('button'); if (!t || t.disabled) return;
  if (t.dataset.sub !== undefined) return startBattle(CUR, CUR.subTopics[+t.dataset.sub]);
  const n = +t.dataset.n, a = t.dataset.a;
  if (a === 'back') return CUR && CUR.subTopics ? showSubList(CUR) : showHome();
  if (a === 'pick') return pick(n);
  if (a === 'tap') return tap(n);
  if (a === 'clear') { B.seq = []; return renderOrder(B.qs[B.i]); }
  if (a === 'lock') return lockSeq();
  if (a === 'begin') return question();
  if (a === 'next') return next();
  if (a === 'retry') return startBattle(CUR, SUB);
});
$('grim').addEventListener('click', (e) => {
  const t = e.target.closest('button'); if (t && t.dataset.a === 'clearG') { S.mistakes = []; save(); renderGrim(); }
});
$('prof').addEventListener('click', (e) => {
  const t = e.target.closest('button'); if (!t) return;
  const a = t.dataset.a;
  if (a === 'sound') { S.sound = !S.sound; save(); renderProf(); }
  else if (a === 'theme') { S.light = !S.light; document.body.classList.toggle('light', S.light); save(); renderProf(); }
  else if (a === 'reset' && confirm('Reset all chapter progress and your streak?')) {
    Object.assign(S, { streak: 0, last: '', cleared: {}, mistakes: [] }); save(); renderProf();
  }
});
document.addEventListener('click', (e) => {
  const t = e.target.closest('button');
  if (t && !['pick', 'tap', 'lock'].includes(t.dataset.a)) sfx('click');
}, true);

// ---------- Start ----------
(async function init() {
  document.body.classList.toggle('light', !!S.light);
  await load();
  showHome();
})();
</script>
</body>
</html>
